services:
  domain-watcher:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      # --- Required ---
      DOMAINS: "example.nl,another.nl"      # comma-separated list

      # --- Timing ---
      CHECK_INTERVAL: "3600"                # seconds between checks (default 1 hour)

      # --- Notifications: pick one or both ---

      # Option A: Webhook (Slack / Discord / generic HTTP POST)
      NOTIFY_WEBHOOK: ""

      # Option B: Email via SMTP
      NOTIFY_EMAIL_TO: ""
      NOTIFY_EMAIL_FROM: ""
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASS: ""
